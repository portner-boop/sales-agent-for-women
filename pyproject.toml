[project]
name = "behappy-bot"
version = "0.1.0"
description = "Telegram bot with a durable agent harness and isolated conversation memory"
requires-python = ">=3.13,<3.15"
dependencies = [
  "aiogram>=3.22,<4",
  "aiosqlite>=0.21,<1",
  "dynaconf>=3.2,<4",
  "pydantic>=2.11,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langmem>=0.0.30,<0.1",
  "langchain-openai>=1,<2",
  "openai>=3.26,<4",
  "tiktoken>=0.11,<1",
  "httpx>=0.28,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "black>=25,<27", "mypy>=1.18,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
junit_family = "legacy"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dynaconf.*", "langmem.*"]
ignore_missing_imports = true
