[default]
environment = "demo"

[default.telegram]
token = ""
poll_timeout = 20

[default.llm]
api_key = ""
output_tokens = 1200
structured_mode = "json_object"
reasoning_effort = "low"
verbosity = "low"

[default.storage]
directory = "data"
queue_size = 256
busy_timeout_ms = 5000
backup_interval_seconds = 3600
retention_days = 30

[default.runtime]
llm_concurrency = 5
llm_attempt_seconds = 12
turn_deadline_seconds = 45
first_deadline_seconds = 15
coalesce_seconds = 0.5
max_coalesce_seconds = 2.0
activity_gap_seconds = 1800
max_message_chars = 16000
kill_switch = false
followup_enabled = true
followup_min_seconds = 60.0
followup_max_seconds = 60.0
followup_ttl_seconds = 90.0
followup_max_count = 2
followup_second_seconds = 180.0

[default.runtime.reply_timing]
enabled = true
pause_min_seconds = 2.0
pause_max_seconds = 4.0
characters_per_second = 3.0
jitter_fraction = 0.2
minimum_seconds = 5.0
maximum_seconds = 60.0

[default.memory]
context_tokens = 64000

[default.commerce]
preview_min_replies = 15
preview_max_replies = 20
